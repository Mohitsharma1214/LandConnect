<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#054c44"/>
      <stop offset="50%" stop-color="#075E54"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#lcBg)"/>
  <rect x="24" y="24" width="464" height="464" rx="110" fill="none" stroke="#25D366" stroke-opacity="0.4" stroke-width="6"/>

  <!-- Land Parcel Polygon (Perspective Grid) -->
  <g filter="url(#dropGlow)">
    <polygon points="126,380 386,380 336,290 176,290" fill="#128C7E" stroke="#25D366" stroke-width="4"/>
    
    <!-- Real Estate Roof / Land Silhouette -->
    <polygon points="256,120 376,240 330,240 256,166 182,240 136,240" fill="#FFFFFF"/>
    <polygon points="256,180 316,240 196,240" fill="#25D366"/>

    <!-- Map Pin Location Beacon (Gold) -->
    <circle cx="256" cy="326" r="28" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="256" cy="326" r="10" fill="#FFFFFF"/>
  </g>
</svg>

